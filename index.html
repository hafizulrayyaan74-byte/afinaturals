<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#16202e;--mut:#5d6675;--acc:#ffb300;--nav:#16202e;--navt:#fff;--line:#dde1e7;--ok:#1b8a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--card:#18202e;--ink:#eef0f3;--mut:#a0a8b6;--nav:#0a0e15;--line:#2a3345}}
:root[data-theme="dark"]{--bg:#0e131c;--card:#18202e;--ink:#eef0f3;--mut:#a0a8b6;--nav:#0a0e15;--line:#2a3345}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.45}
.top{background:var(--nav);color:var(--navt);padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.t1{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.2rem}
.cartb{background:none;border:0;color:var(--navt);font:600 1rem Figtree,sans-serif;cursor:pointer}
.cartb i{background:var(--acc);color:#16202e;border-radius:99px;padding:1px 8px;font-style:normal;margin-left:4px}
.top input{width:100%;margin-top:8px;padding:11px;border:0;border-radius:8px;font:inherit;background:#fff;color:#16202e}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer}
.cats button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:4px 14px 30px;max-width:960px;margin:auto}
.p{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:3.4rem}
.pb{padding:10px;display:flex;flex-direction:column;gap:3px}
.st{color:#e08a00;font-size:.85rem}.st small{color:var(--mut)}
.price{font-size:1.2rem;font-weight:700}
.btn{border:0;background:var(--acc);color:#16202e;font:700 1rem Figtree,sans-serif;padding:12px;border-radius:99px;cursor:pointer;width:100%;margin-top:8px}
.btn.alt{background:#ff8a00}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;z-index:5;padding:0 0 30px}
.sheet.open{display:block}
.sh{background:var(--nav);color:var(--navt);padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;gap:12px;align-items:center;font-weight:700;position:sticky;top:0}
.sh button{background:none;border:0;color:var(--navt);font-size:1.4rem;cursor:pointer}
.in{max-width:560px;margin:auto;padding:14px}
.box{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .n{flex:1}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
label{display:block;font-weight:600;margin-top:10px;font-size:.9rem}
.in input,.in textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.big{font-size:3rem;text-align:center}.ok{color:var(--ok);font-weight:700}
.bank div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.top{background:#131921}.t1 #shop{color:#ffb300;font-size:1.4rem}
.sb{display:flex;margin-top:8px}.sb input{margin:0;border-radius:8px 0 0 8px}.sb button{border:0;background:#ffb300;border-radius:0 8px 8px 0;padding:0 16px;font-size:1.1rem;cursor:pointer}
.hero{margin:0 14px 6px;border-radius:12px;padding:24px 18px;background:linear-gradient(120deg,#1f5f3a,#6aa84f);color:#fff;max-width:932px}
@media(min-width:960px){.hero{margin:0 auto 6px}}
.hero h2{margin:0 0 4px;font-size:1.5rem}.hero p{margin:0 0 12px}.hero button{border:0;background:#ffb300;color:#16202e;font:700 1rem Figtree,sans-serif;padding:10px 20px;border-radius:99px;cursor:pointer}
.perks{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;max-width:960px;margin:auto}.perks span{flex:none;background:var(--card);border-radius:8px;padding:8px 12px;font-size:.85rem;font-weight:600}
.sec{max-width:960px;margin:6px auto 4px;padding:0 14px;font-size:1.25rem}
.tag{display:inline-block;background:#cc0c39;color:#fff;font-weight:700;font-size:.8rem;padding:2px 7px;border-radius:4px;margin-right:6px}
.old{color:var(--mut);text-decoration:line-through;font-size:.9rem;margin-left:6px}
.dl{font-size:.8rem;color:var(--mut)}
footer{background:var(--nav);color:var(--navt);text-align:center;padding:16px;cursor:pointer}footer small{display:block;opacity:.7;margin-top:4px}
.t1 #shop,h2,.price,.sh span{font-family:'Bricolage Grotesque',Figtree,sans-serif}
.t1 #shop{font-weight:800;letter-spacing:-.5px}
.top{box-shadow:0 2px 14px rgba(0,0,0,.25)}
.hero{position:relative;overflow:hidden;padding:34px 20px;background:radial-gradient(circle at 85% 20%,rgba(255,179,0,.55),transparent 45%),linear-gradient(135deg,#0f3d2a,#2f7d4f 60%,#7bbf6a);box-shadow:0 10px 28px rgba(31,95,58,.35)}
.hero::after{content:"🌿";position:absolute;right:14px;bottom:-14px;font-size:6.5rem;opacity:.25;transform:rotate(-15deg)}
.hero h2{font-size:1.9rem;font-weight:800;line-height:1.1;letter-spacing:-.5px;max-width:14ch}
.hero button{box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}.hero button:active{transform:scale(.96)}
.perks span{border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cats button{transition:all .15s}.cats button.on{background:linear-gradient(135deg,#2f7d4f,#0f3d2a);color:#fff;border-color:transparent}
.p{border-radius:16px;box-shadow:0 2px 10px rgba(20,30,50,.08);transition:transform .2s,box-shadow .2s}
.p:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(20,30,50,.16)}
.pic{position:relative;border-radius:16px 16px 0 0;font-size:3.8rem;background-image:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 55%)}
.price{font-size:1.3rem;font-weight:800}
.tag{background:linear-gradient(135deg,#e5173f,#b80c30);border-radius:6px}
.btn{background:linear-gradient(180deg,#ffd24a,#ffb300);box-shadow:0 3px 8px rgba(255,179,0,.4);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.alt{background:linear-gradient(180deg,#ffa133,#ff7a00);color:#fff}
.box{border-radius:16px;box-shadow:0 2px 12px rgba(20,30,50,.08)}
.sec{font-weight:800;letter-spacing:-.3px}
footer{background:linear-gradient(135deg,#0f3d2a,#131921)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:#131921;color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.brand{display:flex;align-items:center;gap:10px}.lg{width:38px;height:38px;border-radius:50%;border:2px solid #d4a82f;object-fit:cover}
.t1 #shop{color:#e6c35c}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:radial-gradient(circle at 80% 30%,rgba(212,168,47,.35),transparent 50%),linear-gradient(135deg,#041a0d,#0e3a22);border:1px solid #d4a82f}
.hero::after{display:none}.hero h2{color:#e6c35c;max-width:16ch}.hero p{color:#e9efe6;letter-spacing:.5px}
.hero button{background:linear-gradient(180deg,#e6c35c,#c79a22)}
.hl{width:42%;max-width:190px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cats button.on{background:linear-gradient(135deg,#0e3a22,#041a0d);color:#e6c35c;border:1px solid #d4a82f}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc)}
</style></head><body>

<script>
// ===== SHOP OWNER: EDIT THIS PART ONLY =====
const SHOP={
 name:"Afi", currency:"$",
 whatsapp:"15551234567",   // your number, country code first, digits only
 endpoint:"https://formspree.io/f/mppwgkkz",   // paste your free Formspree link here (https://formspree.io/f/xxxx)
 email:"hafizulrayyaan74@gmail.com",        // orders are sent here
 bank:{ "Bank":"Your Bank Name","Account name":"Your Name","Account number":"0000000000" },
 products:[
  {name:"Raw honey",cat:"Food",price:12,old:15,rating:5,reviews:96,desc:"Pure, unfiltered honey. Replace this with your own description.",emoji:"🍯",color:"#fde7b0"},
  {name:"Herbal tea",cat:"Food",price:6,old:8,rating:4.5,reviews:58,desc:"A calming herbal blend. Replace this with your own description.",emoji:"🍵",color:"#d8ecd3"},
  {name:"Natural soap",cat:"Body care",price:5,old:7,rating:4.5,reviews:143,desc:"Handmade soap from plant oils. Replace this with your own description.",emoji:"🧼",color:"#e6d6c3"},
  {name:"Coconut oil",cat:"Body care",price:9,old:12,rating:4,reviews:72,desc:"Cold-pressed coconut oil. Replace this with your own description.",emoji:"🥥",color:"#cfe3f7"}
 ]};
// ===== END =====
let cart={},cat="All",last=null;const $=i=>document.getElementById(i),m=n=>SHOP.currency+n.toFixed(2),P=SHOP.products;
document.title=SHOP.name;$("fs").textContent="© "+new Date().getFullYear()+" "+SHOP.name+" · Pure · Natural · Trusted";$("shop").textContent=SHOP.name;
const pr=p=>`<div><span class="price">${m(p.price)}</span>${p.old?`<span class="old">${m(p.old)}</span>`:""}</div>${p.old?`<div><span class="tag">-${Math.round(100-p.price/p.old*100)}%</span><span class="ok">Limited deal</span></div>`:""}`;
const stars=p=>`<div class="st">${"★".repeat(Math.round(p.rating))}${"☆".repeat(5-Math.round(p.rating))} <small>${p.reviews}</small></div>`;
function cats(){$("cats").innerHTML=["All",...new Set(P.map(p=>p.cat))].map(x=>`<button class="${x===cat?"on":""}" onclick="cat='${x}';cats();grid()">${x}</button>`).join("")}
function grid(){const s=$("q").value.toLowerCase();const l=P.map((p,i)=>({p,i})).filter(o=>(cat==="All"||o.p.cat===cat)&&(o.p.name+o.p.desc).toLowerCase().includes(s));
$("grid").innerHTML=l.length?l.map(({p,i})=>`<div class="p" onclick="detail(${i})"><div class="pic" style="background:${p.color}">${p.emoji}</div><div class="pb"><b>${p.name}</b>${stars(p)}${pr(p)}<span class="dl">Free delivery · In stock</span></div></div>`).join(""):"<p>No products found.</p>"}
function show(t,h){$("shT").textContent=t;$("shB").innerHTML=h;$("sh").classList.add("open");$("sh").scrollTop=0}
function closeS(){$("sh").classList.remove("open")}
function detail(i){const p=P[i];show(p.name,`<div class="box"><div class="pic" style="background:${p.color};border-radius:8px">${p.emoji}</div><h2>${p.name}</h2>${stars(p)}${pr(p)}<p class="ok">In stock</p><p class="dl">Delivery to your door · Pay by bank transfer</p><p>${p.desc}</p><button class="btn" onclick="add(${i});closeS()">Add to cart</button><button class="btn alt" onclick="add(${i});openCart()">Buy now</button></div>`)}
function add(i){cart[i]=(cart[i]||0)+1;upd();const t=$("toast");t.textContent="✓ "+P[i].name+" added to cart";t.classList.add("on");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove("on"),1600)}
function chg(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];upd();openCart()}
const total=()=>Object.entries(cart).reduce((s,[i,q])=>s+P[i].price*q,0);
function upd(){$("cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){const e=Object.entries(cart);if(!e.length)return show("Your cart",'<div class="box">Your cart is empty. Pick something from the shop.</div>');
show("Your cart",`<div class="box">${e.map(([i,q])=>`<div class="row"><span class="n">${P[i].emoji} ${P[i].name}<br><b>${m(P[i].price)}</b></span><span class="q"><button onclick="chg(${i},-1)">−</button> ${q} <button onclick="chg(${i},1)">+</button></span></div>`).join("")}<p><b>Total: ${m(total())}</b></p><button class="btn" onclick="details()">Checkout</button></div>`)}
function details(){show("Your details",`<div class="box"><label>Full name</label><input id="nm" autocomplete="name"><label>Phone number</label><input id="ph" type="tel"><label>Email</label><input id="em" type="email"><label>Delivery address</label><textarea id="ad" rows="3"></textarea><button class="btn" onclick="pay()">Continue to payment</button></div>`)}
function pay(){const c={name:$("nm").value.trim(),phone:$("ph").value.trim(),email:$("em").value.trim(),addr:$("ad").value.trim()};
if(!c.name||!c.phone||!c.addr)return alert("Please fill in name, phone and address.");
const id="ORD"+Date.now().toString().slice(-6);last={id,c,items:Object.entries(cart).map(([i,q])=>q+" x "+P[i].name+" ("+m(P[i].price*q)+")"),t:total()};
show("Payment",`<div class="box"><b>Pay ${m(last.t)} by bank transfer</b><div class="bank">${Object.entries(SHOP.bank).map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("")}<div><span>Reference</span><b>${id}</b></div></div><p>Use the reference so we can match your payment. After you transfer, tap the button below.</p><button class="btn" onclick="done()">I have paid</button></div>`)}
async function send(o){try{const r=await fetch(SHOP.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({order:o.id,name:o.c.name,phone:o.c.phone,email:o.c.email,address:o.c.addr,items:o.items.join(' | '),total:m(o.t),_subject:'New order '+o.id})});return r.ok}catch(e){return false}}
async function done(){const o=last;const sent=SHOP.endpoint?await send(o):false;cart={};upd();
const body=`Order ${o.id}%0A${o.items.join("%0A")}%0ATotal: ${m(o.t)}%0A%0AName: ${o.c.name}%0APhone: ${o.c.phone}%0AEmail: ${o.c.email}%0AAddress: ${o.c.addr}`;
show("Order placed",`<div class="box"><div class="big">✅</div><p class="ok" style="text-align:center">Order ${o.id} received</p>${o.items.map(x=>`<div class="row">${x}</div>`).join("")}<p><b>Total paid: ${m(o.t)}</b></p><p>Deliver to: ${o.c.addr}</p>${sent?'<p class="ok">Your order was sent to the shop automatically. We will confirm your payment and ship.</p>':`<a href="mailto:${SHOP.email}?subject=Order%20${o.id}&body=${encodeURI(body).replace(/%0A/g,"%0A")}"><button class="btn">Send order to shop</button></a><a href="https://wa.me/${SHOP.whatsapp}?text=${body}" target="_blank"><button class="btn alt">Send order on WhatsApp</button></a><p style="color:var(--mut);font-size:.9rem">Tap one of the buttons above so we can confirm your payment and ship.</p>`}<button class="btn ghost" onclick="closeS()">Keep shopping</button></div>`)}
cats();grid();
